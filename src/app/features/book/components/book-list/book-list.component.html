<div class="p-6 overflow-auto" (scroll)="onScroll($event)" style="max-height: 80vh;">
  <h1 class="text-4xl font-bold mb-6 text-center text-gray-800">Lista de Libros 📚</h1>

  <!-- Filtros de búsqueda y categoría -->
  <div class="mb-6 flex justify-between items-center">
    <input 
      type="text" 
      class="border border-gray-300 p-3 rounded-lg w-2/3 focus:outline-none focus:ring-2 focus:ring-blue-500"
      [(ngModel)]="searchTerm" 
      (input)="onSearchChange()" 
      placeholder="Buscar por título, autor..."
    />

    <select 
      class="border border-gray-300 p-3 rounded-lg w-1/3 ml-4 focus:outline-none focus:ring-2 focus:ring-blue-500" 
      [(ngModel)]="category" 
      (change)="onCategoryChange()">
      <option [ngValue]="null">Seleccionar categoría</option>
      <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
    </select>
  </div>

  <!-- Lista de libros -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let book of books" class="bg-white shadow-lg rounded-lg p-6 hover:shadow-xl transition duration-300 ease-in-out">
      <h2 class="text-2xl font-semibold text-gray-800 mb-2">{{ book.title }}</h2>
      <h3 class="text-md text-gray-600 mb-4">por {{ book.author }}</h3>
      <p class="text-gray-700 text-sm mb-4">{{ book.description }}</p>

      <!-- Mostrar los géneros -->
      <div class="flex flex-wrap gap-2">
        <span *ngFor="let genre of book.genres" class="inline-block bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full">
          {{ genre }}
        </span>
      </div>

      <button 
        class="mt-6 bg-blue-600 text-white text-sm px-6 py-2 rounded-lg transition duration-300 ease-in-out hover:bg-blue-700"
        [routerLink]="['/home/book/detail', book.id]">
        Ver Detalles
      </button>
    </div>

    <!-- Indicador de carga -->
    <div *ngIf="isLoading" class="text-center mt-4 col-span-full">
      <span class="text-gray-500">Cargando más libros...</span>
    </div>
  </div>
</div>
