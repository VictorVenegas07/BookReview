<h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">Iniciar sesión</h2>
<form (submit)="onLogin()" class="space-y-6"> 
  <div>
    <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
    <input
      id="email"
      type="email"
      placeholder="Introduce tu correo"
      [(ngModel)]="email"
      name="username" 
      class="w-full p-3 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
    />
  </div>

  <div>
    <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
    <input
      id="password"
      type="password"
      placeholder="Introduce tu contraseña"
      [(ngModel)]="password"
      name="password" 
      class="w-full p-3 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
    />
  </div>

  <div>
    <button 
      type="submit" 
      class="w-full p-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
      Iniciar sesión
    </button>
  </div>

  <div class="text-center">
    <p class="text-sm text-gray-600">
      ¿No tienes una cuenta? <a [routerLink]="['/auth/register']" class="text-blue-500 hover:underline">Regístrate</a>
    </p>
   
  </div>
</form>
