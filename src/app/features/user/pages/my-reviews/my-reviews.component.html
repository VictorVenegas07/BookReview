<div class="p-6">
  
      <h2 class="text-2xl font-semibold mb-4">Reseñas</h2>
  
      <div class="review-scroll-container mb-4" (scroll)="onScroll($event)">
        <div *ngFor="let review of reviews">
          <app-review-card
            [review]="review"
            [canEdit]="canEditReview(review.userId)"
            (saveReviewEvent)="saveReview($event)"
            (deleteReviewEvent)="deleteReview($event)"
          ></app-review-card>
        </div>

        <div *ngIf="isLoadingReviews" class="text-center mt-4">
          <span class="text-gray-500">Cargando más reseñas...</span>
        </div>
      </div>
  
    </div>
