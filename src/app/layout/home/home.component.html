<div class="flex flex-col h-screen">
  <!-- Navbar -->
  <nav class="flex items-center justify-between bg-white shadow-md p-4">
    <div class="flex-1 flex justify-center">
      <!-- <input
          type="text"
          placeholder="Buscar libros..."
          class="w-full max-w-md p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        /> -->
    </div>
    <div class="ml-4 flex items-center space-x-2 cursor-pointer" (click)="toggleSidebar()">
      <div *ngIf="user && user.username">
        <img *ngIf="profilePictureUrl" [src]="profilePictureUrl" alt="Book Cover" class="w-10 h-10 rounded-full"
          loading="lazy">

        <img *ngIf="!profilePictureUrl" src="https://ui-avatars.com/api/?name={{ user.username }}" alt="Avatar"
          class="w-10 h-10 rounded-full">
      </div>
      <span class="hidden md:inline text-gray-700 font-medium">{{user.username}}</span>
    </div>
  </nav>

  <div *ngIf="isSidebarOpen" class="fixed inset-0  bg-opacity-50 z-50 transition-opacity duration-300"
    (click)="toggleSidebar()">
    <div (click)="$event.stopPropagation()"
      class="fixed top-0 right-0 w-72 h-full bg-white shadow-lg text-gray-800 p-6 flex flex-col justify-between transform transition-transform duration-300 ease-in-out"
      [ngClass]="{'translate-x-0': isSidebarOpen, 'translate-x-full': !isSidebarOpen}">

      <div class="flex items-center mb-8 border-b border-gray-200 pb-6">
        <div *ngIf="user && user.username">
          <img *ngIf="profilePictureUrl" [src]="profilePictureUrl" alt="Book Cover"
            class="w-16 h-16 rounded-full border-2 border-gray-300 mr-4" loading="lazy">

          <img *ngIf="!profilePictureUrl" src="https://ui-avatars.com/api/?name={{ user.username }}" alt="Avatar"
            class="w-16 h-16 rounded-full border-2 border-gray-300 mr-4">
        </div>
        <div>
          <h2 class="text-xl font-semibold">{{user.username}}</h2>
          <p class="text-sm text-gray-600">Miembro desde 2021</p>
        </div>
      </div>

      <div class="space-y-4 mb-auto">
        <div>
          <h3 class="text-lg font-semibold text-gray-700">Mi cuenta</h3>
          <ul class="space-y-2">
            <li class="flex items-center space-x-4 hover:bg-gray-100 p-2 rounded-lg cursor-pointer transition-colors">
              <i class="fas fa-user-circle"></i>
              <a [routerLink]="['user/profile']" class="text-base">Mi perfil</a>
            </li>
            <li class="flex items-center space-x-4 hover:bg-gray-100 p-2 rounded-lg cursor-pointer transition-colors">
              <i class="fas fa-star"></i>
              <a [routerLink]="['user/my-reviews']" class="text-base">Mis reseñas</a>
            </li>
          </ul>
        </div>
      </div>

      <div class="mt-6">
        <button (click)="cerrarSesion()"
          class="w-full p-2 border-t border-gray-300 text-gray-600 hover:text-gray-900 text-left">
          <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </div>


  <main class="flex-1 overflow-auto p-4 bg-gray-50">
    <router-outlet></router-outlet>
  </main>


</div>
